name: Build Arch Package

on:
  push:
    tags:
      - '*'          # 推送任意版本 tag（如 1.6.0）时触发
  workflow_dispatch: # 也支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest   # makepkg 需要在 Arch Linux 环境中运行
    permissions:
      contents: write             # 创建 GitHub Release 需要写权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -Syu --needed --noconfirm base-devel git meson pkgconf cmake appstream-glib

      - name: Create non-root user for makepkg
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        working-directory: scripts
        run: |
          su builder -c "makepkg -f --noconfirm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: scripts/*.pkg.tar.zst

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: scripts/*.pkg.tar.zst
          generate_release_notes: true
          fail_on_unmatched_files: true
